name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Audit production dependencies
      run: npm audit --audit-level=high --omit=dev

    - name: Run linter
      run: npm run lint
    
    - name: Run tests with coverage thresholds
      # test:coverage runs the full suite AND enforces config/vitest.config.ts
      # thresholds; plain `npm test` let a branch-coverage drop merge green.
      run: npm run test:coverage
    
    - name: Build
      run: npm run build