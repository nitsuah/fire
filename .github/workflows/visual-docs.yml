name: Visual docs

# Regenerates documented UI screenshots from tagged journeys and renders Mermaid
# diagrams. The generated-assets PR never pushes directly to main.
# For journey/diagram-only changes, run this workflow_dispatch manually.
# See nitsuah/vigil docs/VISUAL_DOCS.md and promo/spots.json for image IDs.
#
# Keep push triggers limited to files that can visibly change the captured UI.
# Exclude generated screenshots, README, tests, backend/server code, and this
# workflow itself to prevent documentation updates from retriggering the job.

on:
  push:
    branches: [main]
    paths:
      - 'app/app.js'
      - 'app/index.html'
      - 'app/styles.css'
      - 'app/lib/**'
      - 'app/routes/**'
      - 'app/templates/**'
      - 'promo/demo-seed.js'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-docs
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: mkdir -p docs/screenshots && npm run capture:screenshots
        env:
          CI: true

      - name: Render diagrams
        run: |
          # ubuntu-latest ships Google Chrome; point mermaid-cli's Puppeteer at it.
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$CHROME" ]; then
            printf '{"executablePath":"%s","args":["--no-sandbox"]}' "$CHROME" > "$RUNNER_TEMP/puppeteer.json"
            PUPPETEER="-p $RUNNER_TEMP/puppeteer.json"
          fi
          CONFIG=""; [ -f docs/diagrams/mermaid.config.json ] && CONFIG="-c docs/diagrams/mermaid.config.json"
          for f in docs/diagrams/*.mmd; do
            npx -y @mermaid-js/mermaid-cli@12.0.0 $PUPPETEER $CONFIG -b white -i "$f" -o "${f%.mmd}.svg"
          done

      - name: Update README block
        run: node scripts/visual-docs-readme.mjs

      - name: Open or update PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/visual-docs
          delete-branch: true
          add-paths: |
            docs/diagrams/*.svg
            docs/screenshots/*.png
            README.md
          commit-message: 'docs: regenerate screenshots and diagrams'
          title: 'docs: regenerate screenshots and diagrams'
          body: |
            Regenerated from the journeys and docs/diagrams by `.github/workflows/visual-docs.yml` after ${{ github.sha }}.
            Review the images, then merge. No code changes.
