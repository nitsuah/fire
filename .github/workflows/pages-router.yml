name: Pages router smoke

# Runs the Cloudflare Pages Function router as Pages bundles it
# (`wrangler pages dev`), with no secrets, and curls the public routes.
on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'functions/**'
      - 'netlify/functions/**'
      - 'app/lib/**'
      - 'wrangler.toml'
      - 'scripts/pages-router-smoke.sh'
      - '.github/workflows/pages-router.yml'
  push:
    branches: [ main ]
    paths:
      - 'cloudflare/**'
      - 'functions/**'
      - 'netlify/functions/**'
      - 'wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Start wrangler pages dev (no secrets)
      run: |
        npx --yes wrangler@4.168.0 pages dev app --port 8788 --ip 127.0.0.1 > wrangler.log 2>&1 &
        echo $! > wrangler.pid
        for i in $(seq 1 60); do
          if curl -s -o /dev/null -m 2 http://127.0.0.1:8788/; then echo "ready after ${i}s"; exit 0; fi
          sleep 1
        done
        echo "wrangler did not become ready"; cat wrangler.log; exit 1
    - name: Assert routes
      run: sh scripts/pages-router-smoke.sh http://127.0.0.1:8788
    - name: Show wrangler log on failure
      if: failure()
      run: cat wrangler.log
