[build]
  publish = "app"

# Every production deploy costs Netlify credits, so skip the ones that cannot
# change what is served. Only the static app, the functions (which import from
# app/lib), this file and the dependency manifests ship. Docs, screenshots,
# tests, promo, site/ (GitHub Pages) and config do not. Exit 0 = no changes =
# skip; an empty CACHED_COMMIT_REF or COMMIT_REF is guarded explicitly (exit 1 = build), so it fails open.
# Production only: deploy previews are free and stay on for review.
[context.production]
  ignore = "test -n \"$CACHED_COMMIT_REF\" && test -n \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- app netlify netlify.toml package.json package-lock.json"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The browser-only deploy serves the eBay routes from Netlify Functions at the
# same public paths the Express server uses (status 200 = rewrite, query
# string preserved; force = win over any static file). /status and /toggle
# stay client-side in this mode (see app/lib/side-gig.js).
[[redirects]]
  from = "/api/sync/ebay/marketplace-account-deletion"
  to = "/.netlify/functions/ebay-marketplace-account-deletion"
  status = 200
  force = true

[[redirects]]
  from = "/api/sync/ebay/authorize"
  to = "/.netlify/functions/ebay-authorize"
  status = 200
  force = true

[[redirects]]
  from = "/api/sync/ebay/callback"
  to = "/.netlify/functions/ebay-callback"
  status = 200
  force = true

[[redirects]]
  from = "/api/sync/ebay/sync"
  to = "/.netlify/functions/ebay-sync"
  status = 200
  force = true

# Plaid has a browser-local encrypted token flow on the static deploy.
[[redirects]]
  from = "/api/sync/plaid/*"
  to = "/.netlify/functions/plaid/:splat"
  status = 200
  force = true

# Etsy OAuth (PKCE) + receipts sync. Tokens go back to the browser sealed
# with SYNC_MASTER_KEY; status/toggle/disconnect are browser-side here.
[[redirects]]
  from = "/api/sync/etsy/*"
  to = "/.netlify/functions/etsy/:splat"
  status = 200
  force = true

# CoinTracker OAuth + read-only MCP sync (tokens stay sealed in the browser).
[[redirects]]
  from = "/api/sync/cointracker/*"
  to = "/.netlify/functions/cointracker/:splat"
  status = 200
  force = true

# Google Drive encrypted backup. Tokens go back to the browser sealed with
# SYNC_MASTER_KEY; the browser sends the state to back up and applies the
# decrypted state on restore. The bare path is POST "back up now".
[[redirects]]
  from = "/api/backup/drive"
  to = "/.netlify/functions/gdrive-backup"
  status = 200
  force = true

[[redirects]]
  from = "/api/backup/drive/*"
  to = "/.netlify/functions/gdrive-backup/:splat"
  status = 200
  force = true

# All remaining /api/* paths go through a JSON-safe compatibility function.
# Specific eBay rules above win first; unsupported hosted APIs return JSON
# instead of Netlify's HTML 404 page, while stateless hosted integrations
# (metals/ENS) are handled directly by fire-api.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/fire-api/:splat"
  status = 200
  force = true
